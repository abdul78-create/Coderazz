# ==============================================================================
# CodeRazz — Unified Docker Compose Stack (docker-compose.yml)
# PostgreSQL 16 + FastAPI Gunicorn Backend + Next.js 15 Standalone Frontend
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: coderazz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coderazz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coderazz_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-coderazz_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coderazz_user} -d ${POSTGRES_DB:-coderazz_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend Service & Sandbox Orchestrator
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: coderazz-backend:latest
    container_name: coderazz_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "true"
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coderazz_user}:${POSTGRES_PASSWORD:-coderazz_local_password}@db:5432/${POSTGRES_DB:-coderazz_db}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-coderazz_user}:${POSTGRES_PASSWORD:-coderazz_local_password}@db:5432/${POSTGRES_DB:-coderazz_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-prod_jwt_super_secure_signing_key_minimum_32_bytes_2026}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]'
      DOCKER_HOST: unix:///var/run/docker.sock
      EXECUTION_IMAGE: coderazz-python-runner:latest
    group_add:
      - "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 3. Next.js 15 Standalone Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: coderazz-frontend:latest
    container_name: coderazz_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  postgres_data:
    name: coderazz_postgres_data
